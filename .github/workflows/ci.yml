name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  windows:
    name: Windows
    if: github.event_name == 'pull_request' && github.event.action != 'labeled'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: python -m pip install -r requirements/windows-build.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pip check
      - run: ruff check .
      - run: pytest

  build-windows:
    name: Windows onedir
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'build-windows') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          set-safe-directory: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: python -m pip install -r requirements/windows-build.txt
      - run: python -m pip freeze > windows-freeze.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pip check
      - run: python scripts/build_windows.py
      - name: Read actual checkout SHA
        shell: pwsh
        run: |
          $sourceCommit = git rev-parse HEAD
          "SOURCE_COMMIT=$sourceCommit" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-carrier-manager-${{ env.SOURCE_COMMIT }}
          path: |
            dist/*.zip
            windows-freeze.txt
          retention-days: 7
          if-no-files-found: error
